name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff numpy pillow opencv-python-headless pyyaml matplotlib
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m pytest
      - name: Run linter
        run: python -m ruff check src tests scripts/build_report.py
