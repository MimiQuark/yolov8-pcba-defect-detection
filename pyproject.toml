[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcba-defect-detection"
version = "0.1.0"
description = "YOLOv8-based PCBA five-class defect detection project"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "ultralytics==8.4.174",
  "gradio==6.29.1",
  "onnx==1.23.2",
  "onnxruntime>=1.23,<2",
  "pyyaml>=6.0,<7",
  "matplotlib>=3.10,<4",
  "pandas>=2.2,<4",
  "pillow>=11,<13",
  "numpy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.11,<1",
  "python-docx>=1.2,<2",
]

[project.scripts]
pcba = "pcba_defect.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
